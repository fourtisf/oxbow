# Nginx site for oxbowflow.com: /api goes to the Oxbow API on 127.0.0.1:4000,
# everything else to the Next.js app on 127.0.0.1:3000. Copy to
# /etc/nginx/sites-available/, link it into sites-enabled, then run
# certbot --nginx to add HTTPS (again after each copy: see infra/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name oxbowflow.com www.oxbowflow.com;

    server_tokens off;
    client_max_body_size 1m;

    # The Oxbow API. It rate-limits by the address in X-Forwarded-For.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live trade feed (server-sent events): unbuffered and long-lived.
    location = /api/feed/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: the app rate-limits by the first address in this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app trusts this header for the region notice. Drop whatever the client sent;
        # set it here from GeoIP2 if you turn region blocking on.
        proxy_set_header CF-IPCountry "";
        proxy_read_timeout 60s;
    }
}
